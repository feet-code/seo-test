name: Monitor SEO sites

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check all deployed sites
        run: python scripts/monitor.py
